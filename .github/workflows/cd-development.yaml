name: wf-cd-development
on:
  pull_request:
    branches:
      -develop
jobs:
  cd-build-development-job:
  runs-on: ubuntu-latest
  steps:
    - name: checkout repository
      uses: actions/checkout@v4
    - name: create build artifacts
      run:  |
         npx parcel build "./src/index.html" --dist-dir "./dist" --public-url "./"
    - name: upload development artifacts
      uses: actions/upload-pages-artifact@v3
    - with:
        path: "./dist"     
        name: "development-artifacts"
  cd-deploy-development-jobs:
    needs: " cd-build-development-job"
    enviroment: "development-env"
    permissions:
      pages: write
      id-token: write
   runs-on: ubuntu-latest
  steps:
    - name: deploy artifcats
      uses: actions/deploy-pages@v4
      with:
        artifact_name: "development-artifacts"
        token: ${{github.token}}   
          
